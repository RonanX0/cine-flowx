[build]
  command = "echo 'Build pre-compilado pronto em dist/'"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"
  NPM_FLAGS = "--legacy-peer-deps"

[[redirects]]
  from = "/api/public/upload-temp"
  to = "/.netlify/functions/upload-temp"
  status = 200

[[redirects]]
  from = "/api/public/nvidia"
  to = "/.netlify/functions/nvidia"
  status = 200

[[redirects]]
  from = "/api/public/ig-rupload"
  to = "/.netlify/functions/ig-rupload"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
