<!DOCTYPE html>
<html lang="pt">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Página não encontrada — CineClip</title>
    <meta name="robots" content="noindex" />
    <meta name="description" content="Esta página não existe no CineClip." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%AC%3C/text%3E%3C/svg%3E" />
    <style>
      :root {
        --background: oklch(13% 0.008 285);
        --card: oklch(17% 0.01 285);
        --border: oklch(28% 0.012 285);
        --accent: oklch(55% 0.2 300);
        --primary: oklch(58% 0.24 27);
        --fg: oklch(96% 0.004 285);
        --muted: oklch(70% 0.012 285);
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 2rem 1.25rem;
        background: var(--background);
        color: var(--fg);
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      main {
        max-width: 34rem;
        width: 100%;
        text-align: center;
      }
      .code {
        font-size: clamp(4rem, 18vw, 7rem);
        line-height: 1;
        font-weight: 800;
        letter-spacing: -0.04em;
        background: linear-gradient(120deg, var(--accent), var(--primary));
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        margin: 0 0 0.5rem;
      }
      h1 {
        font-size: 1.375rem;
        font-weight: 600;
        margin: 0 0 0.75rem;
      }
      p {
        color: var(--muted);
        line-height: 1.65;
        margin: 0 0 2rem;
      }
      .actions {
        display: flex;
        gap: 0.75rem;
        justify-content: center;
        flex-wrap: wrap;
      }
      a.button {
        display: inline-block;
        padding: 0.625rem 1.25rem;
        border-radius: 0.5rem;
        text-decoration: none;
        font-size: 0.9375rem;
        font-weight: 500;
        transition: filter 0.15s ease;
      }
      a.button:hover { filter: brightness(1.12); }
      a.button:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 3px;
      }
      .primary {
        background: var(--primary);
        color: oklch(99% 0 0);
        border: 1px solid transparent;
      }
      .secondary {
        background: var(--card);
        color: var(--fg);
        border: 1px solid var(--border);
      }
      footer {
        margin-top: 2.5rem;
        font-size: 0.8125rem;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <main>
      <p class="code">404</p>
      <h1>Esta página não existe</h1>
      <p>
        O endereço que seguiste não corresponde a nada no CineClip. Se vieste
        da app, volta ao início — o teu trabalho continua guardado.
      </p>
      <div class="actions">
        <a class="button primary" href="/">Voltar ao CineClip</a>
        <a class="button secondary" href="/index.html">Abrir a app</a>
      </div>
      <footer>CineClip — limpa, corta e legenda clipes de filmes</footer>
    </main>
  </body>
</html>
