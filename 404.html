// O Apps Script não lê cabeçalhos HTTP próprios -> o token vai no query string.
// E devolve sempre HTTP 200, com {ok:false,...} em caso de erro.
function driveApi(params) {
  const parts = [];
  for (const k in params) {
    const v = params[k];
    if (v === null || v === undefined || v === "") continue;
    parts.push(encodeURIComponent(k) + "=" + encodeURIComponent(v));
  }
  const sep = DRIVE_SCRIPT_URL.indexOf("?") >= 0 ? "&" : "?";
  return DRIVE_SCRIPT_URL + sep + parts.join("&");
}

function driveFetch(params, options) {
  const opts = options || {};
  opts.muteHttpExceptions = true;
  opts.followRedirects = true;
  const res = UrlFetchApp.fetch(driveApi(params), opts);
  const text = res.getContentText();
  let json = null;
  try { json = JSON.parse(text); } catch (e) {}
  return { code: res.getResponseCode(), text: text, json: json };
}

function isDriveUrl(url) {

  if (DRIVE_SCRIPT_URL && s.indexOf(DRIVE_SCRIPT_URL.split("?")[0]) === 0) return true;
  return s.indexOf("script.google.com/") >= 0 || s.indexOf("googleusercontent.com/") >= 0;
}

function verificarEPostarReels() {
  const vault = lerCofreNuvem();
  if (!vault || !Array.isArray(vault.queue)) {
    Logger.log("Nenhum cofre encontrado na nuvem. Abre o CineClip, faz login e clica no ícone da nuvem no topo para sincronizar.");
    return;
  }

  const now = Date.now();
  const accounts = Array.isArray(vault.accounts) ? vault.accounts : [];
  let alterou = false;
  let publicados = 0;
  const pendentes = [];

  for (let i = 0; i < vault.queue.length; i++) {
    const item = vault.queue[i];
    if (item.status !== "scheduled") continue;

    const acc = accounts.find(function (a) { return a.id === (item.accountId || "acc_default"); }) || accounts[0];
    if (!acc || acc.autoPilot === false || acc.mode === "browser_bot") continue;

    const dueTime = item.scheduledTimestamp || new Date(String(item.scheduledAt) + ":00-03:00").getTime();

    // Sem vídeo na nuvem → o Robô não consegue publicar. Marca para o app reenviar.
    if (!item.remoteVideoUrl) {
      pendentes.push(item.title + " (sem vídeo na nuvem)");
      if (!item.needsReupload) {
        item.needsReupload = true;
        item.cloudError = "Robô 24h: este Reel não tem vídeo na nuvem. Abre o CineClip no aparelho onde o criaste e clica em 'Reenviar p/ nuvem'.";
        alterou = true;
      }
      continue;
    }

    if (now < dueTime) continue;

    // O link ainda existe? (hosts temporários apagam os ficheiros)
    const problema = verificarLink(item.remoteVideoUrl);
    if (problema) {
      item.needsReupload = true;
      item.updatedAt = Date.now();
      item.cloudError = "Robô 24h: o link do vídeo deixou de responder (" + problema + "). Reenvia o vídeo para a nuvem no app.";
      alterou = true;
      Logger.log("❌ Link morto em '" + item.title + "': " + problema);
      continue;
    }

    if (publicados >= MAX_POR_EXECUCAO) {
      pendentes.push(item.title + " (fica para a próxima execução de 5 min)");
      continue;
    }

    // 🔒 Reclama o item: se o app (ou outro Robô) já o estiver a publicar, esta
    // execução ignora-o para não publicar o mesmo Reel duas vezes.
    const claim = reclamarPublicacao(item.id);
    if (claim && claim.ocupado) {
      pendentes.push(item.title + " (a ser publicado por " + (claim.holder || "outro dispositivo") + ")");
      Logger.log("⏳ '" + item.title + "' está a ser publicado por " + (claim.holder || "outro dispositivo") + " — ignorado nesta execução.");
      continue;
    }

    Logger.log("🚀 Horário atingido — a publicar '" + item.title + "' em " + acc.name);
    try {
      const coverUrl = normalizarPoster(item.poster);

      if (acc.mode === "webhook") {
        if (!acc.webhookUrl) throw new Error("Webhook URL vazia na conta " + acc.name);
        const res = UrlFetchApp.fetch(acc.webhookUrl.trim(), {
          method: "post",
          contentType: "application/json",
          payload: JSON.stringify({
            id: item.id,
            accountId: acc.id,
            accountName: acc.name,
            title: item.title,
            originalTitle: item.originalTitle,
            year: item.year,
            hookText: item.hookText,
            caption: item.caption,
            scheduledAt: item.scheduledAt,
            platforms: item.platforms || ["instagram"],
            videoUrl: item.remoteVideoUrl,
            coverUrl: coverUrl,
            poster: coverUrl,
            videoFileName: item.videoFileName
          }),
          muteHttpExceptions: true
        });
        if (res.getResponseCode() >= 400) throw new Error("Webhook HTTP " + res.getResponseCode());
        item.publishedId = "webhook_24h_" + Date.now();
      } else {
        if (!acc.igUserId || !acc.metaAccessToken) throw new Error("IG User ID ou Meta Token ausente na conta " + acc.name);
        item.publishedId = publicarMetaGraphApi(acc, item, coverUrl);
      }

      item.status = "published";
      item.updatedAt = Date.now();
      item.lastStep = "Publicado pelo Robô 24h na nuvem (PC e celular desligados) ✔";
      item.errorMsg = "";
      item.needsReupload = false;
      item.cloudError = "";
      alterou = true;
      publicados++;
      Logger.log("✅ Publicado com sucesso: " + item.title);
    } catch (err) {
      const msg = err && err.message ? err.message : String(err);
      item.status = "error";
      item.updatedAt = Date.now();
      item.errorMsg = "Robô 24h: " + msg;
      if (/video|url|download|source|media/i.test(msg)) {
        item.needsReupload = true;
        item.cloudError = "Robô 24h: a Meta não conseguiu ler o vídeo (" + msg + "). Reenvia-o para a nuvem no app.";
      }
      alterou = true;
      Logger.log("❌ Erro ao publicar '" + item.title + "': " + msg);
    } finally {
      // Liberta a claim em qualquer caso (sucesso ou erro) para o app poder
      // publicar os próximos itens sem esperar pelo TTL.
      libertarReclamacao(claim);
    }
  }

  if (alterou) {
    vault.updatedAt = Date.now();
    salvarCofreNuvem(vault);
  }
  Logger.log("Resumo: " + publicados + " publicado(s), " + pendentes.length + " pendente(s)" + (pendentes.length ? " → " + pendentes.join(" | ") : ""));
}

// Devolve null se o link está vivo, ou uma descrição do problema.
function verificarLink(url) {
  const alvo = String(url || "");
  // Google Drive/Apps Script: usa o endpoint leve "videohead".
  // O ContentService não suporta Range — um GET normal descarregava o vídeo inteiro
  // e gastava a quota diária de saída do UrlFetchApp.
  if (isDriveUrl(alvo)) {
    const idMatch = alvo.match(/[?&]id=([^&]+)/);
    if (idMatch) {
      try {
        const r = driveFetch({ action: "videohead", id: decodeURIComponent(idMatch[1]), token: DRIVE_TOKEN });
        if (r.json && r.json.ok === true && Number(r.json.size) > 0) return null;
        if (r.json && r.json.ok === false) return "Drive: " + (r.json.error || "resposta sem detalhe");
        return "HTTP " + r.code + " (o Apps Script não devolveu JSON — confirma a implantação como 'Qualquer pessoa')";
      } catch (e) {
        return "exceção no videohead: " + (e && e.message ? e.message : String(e));
      }
    }
  }
  try {
    const res = UrlFetchApp.fetch(url, {
      method: "get",
      headers: { Range: "bytes=0-0" },
      muteHttpExceptions: true
    });
    const code = res.getResponseCode();
    if (code === 200 || code === 206) return null;
    return "HTTP " + code;
  } catch (e) {
    return "exceção: " + (e && e.message ? e.message : String(e));
  }
}

function normalizarPoster(p) {
  if (!p) return "";
  const s = String(p).trim();
  const marker = "/t/p/w";
  const i = s.indexOf(marker);
  if (i < 0) return s;
  const j = s.indexOf("/", i + marker.length);
  if (j < 0) return s;
  const size = s.substring(i + marker.length, j);
  const pequenos = ["92", "154", "185", "300", "342", "500"];
  if (pequenos.indexOf(size) < 0) return s;
  return s.substring(0, i) + marker + "780" + s.substring(j);
}

function publicarMetaGraphApi(acc, item, coverUrl) {
  const igId = encodeURIComponent(acc.igUserId.trim());
  const token = acc.metaAccessToken.trim();

  function criarContainer(usarCapa) {
    const payload = {
      media_type: "REELS",
      video_url: item.remoteVideoUrl,
      caption: item.caption || "",
      share_to_feed: acc.shareToFeed !== false ? "true" : "false",
      access_token: token
    };
    if (usarCapa && coverUrl) payload.cover_url = coverUrl;
    const r = UrlFetchApp.fetch(GRAPH_BASE + "/" + igId + "/media", {
      method: "post",
      payload: payload,
      muteHttpExceptions: true
    });
    return JSON.parse(r.getContentText());
  }

  let createJson = criarContainer(true);
  if ((!createJson || createJson.error || !createJson.id) && coverUrl) createJson = criarContainer(false);
  if (!createJson || createJson.error || !createJson.id) {
    throw new Error((createJson && createJson.error && createJson.error.message) || "Falha ao criar container Meta");
  }

  const containerId = String(createJson.id);
  for (let tent = 0; tent < 25; tent++) {
    Utilities.sleep(6000);
    const stRes = UrlFetchApp.fetch(
      GRAPH_BASE + "/" + containerId + "?fields=status_code,status&access_token=" + encodeURIComponent(token),
      { muteHttpExceptions: true }
    );
    const stJson = JSON.parse(stRes.getContentText());
    if (stJson.status_code === "FINISHED") break;
    if (stJson.status_code === "ERROR" || stJson.status_code === "EXPIRED") {
      throw new Error("Meta rejeitou o processamento do vídeo: " + (stJson.status || stJson.status_code));
    }
  }

  const pubRes = UrlFetchApp.fetch(GRAPH_BASE + "/" + igId + "/media_publish", {
    method: "post",
    payload: { creation_id: containerId, access_token: token },
    muteHttpExceptions: true
  });
  const pubJson = JSON.parse(pubRes.getContentText());
  if (!pubJson || pubJson.error || !pubJson.id) {
    throw new Error((pubJson && pubJson.error && pubJson.error.message) || "Erro no media_publish");
  }
  return String(pubJson.id);
}

function cryptStream256(dataBytes, keyBytes, ivBytes) {
  const s = new Uint32Array(8);
  for (let i = 0; i < 8; i++) {
    s[i] = ((keyBytes[i * 4] || 0) << 24) | ((keyBytes[i * 4 + 1] || 0) << 16) | ((keyBytes[i * 4 + 2] || 0) << 8) | (keyBytes[i * 4 + 3] || 0);
    s[i] ^= (((ivBytes[(i * 2) % ivBytes.length] || 0) << 8) | (ivBytes[(i * 2 + 1) % ivBytes.length] || 0)) ^ Math.imul(i + 1, 0x9e3779b9);
  }
  function nextByte(idx) {
    const k = idx & 7;
    let x = (s[k] + 0x9e3779b9 + idx) | 0;
    x ^= x << 13;
    x ^= x >>> 17;
    x ^= x << 5;
    s[k] = x;
    s[(k + 1) & 7] = (s[(k + 1) & 7] ^ Math.imul(x, 0x85ebca6b)) | 0;
    return (x ^ (x >>> 8) ^ (x >>> 16) ^ (x >>> 24)) & 0xff;
  }
  for (let warm = 0; warm < 64; warm++) nextByte(warm);
  const out = new Uint8Array(dataBytes.length);
  for (let i = 0; i < dataBytes.length; i++) out[i] = dataBytes[i] ^ nextByte(i);
  return out;
}

function b64ToUint8(b64) {
  const arr = Utilities.base64Decode(b64);
  const out = new Uint8Array(arr.length);
  for (let i = 0; i < arr.length; i++) out[i] = (arr[i] + 256) & 255;
  return out;
}

function uint8ToB64(u8) {
  const arr = [];
  for (let i = 0; i < u8.length; i++) arr.push(u8[i] > 127 ? u8[i] - 256 : u8[i]);
  return Utilities.base64Encode(arr);
}

function encriptarTexto(plainStr) {
  const jsonBytes = Utilities.newBlob(plainStr, "application/json").getBytes();
  const plainU8 = new Uint8Array(jsonBytes.length);
  for (let i = 0; i < jsonBytes.length; i++) plainU8[i] = (jsonBytes[i] + 256) & 255;
  const iv = new Uint8Array(16);
  for (let i = 0; i < 16; i++) iv[i] = Math.floor(Math.random() * 256);
  const cipherU8 = cryptStream256(plainU8, b64ToUint8(ENCRYPTION_KEY_B64), iv);
  return JSON.stringify({ v: 2, iv: uint8ToB64(iv), ct: uint8ToB64(cipherU8) });
}

function desencriptarTexto(cipherStr) {
  try {
    const parsed = JSON.parse(cipherStr);
    if (parsed.v !== 2) return null;
    const plainBytes = cryptStream256(b64ToUint8(parsed.ct), b64ToUint8(ENCRYPTION_KEY_B64), b64ToUint8(parsed.iv));
    const signed = [];
    for (let j = 0; j < plainBytes.length; j++) signed.push(plainBytes[j] > 127 ? plainBytes[j] - 256 : plainBytes[j]);
    return JSON.parse(Utilities.newBlob(signed).getDataAsString("UTF-8"));
  } catch (e) {
    Logger.log("Falha a desencriptar o cofre (senha diferente da usada na criação?): " + e);
    return null;
  }
}

/* ------------------------------------------ 🔒 claims (anti-publicação dupla) */
// O Robô e o app (browser) podem estar acordados ao mesmo tempo. Sem uma trava,
// os dois leem o cofre, os dois veem "status: scheduled" e os dois publicam o
// mesmo Reel. Antes de publicar, o Robô reclama o item no backend:
//   Worker (R2)   → POST /api/claims/acquire   |  release em /api/claims/release
//   Apps Script   → POST ?action=claim         |  release em ?action=release
// Se o backend ainda for antigo (sem claims), publica-se na mesma: nunca se
// perde uma publicação por causa desta proteção.

const CLAIM_TTL_MS = 10 * 60 * 1000;
const CLAIM_OWNER_KEY = "CINECLIP_ROBO_OWNER";

/** Identificador estável deste Robô (fica nas Script Properties do projeto). */
function roboOwner() {
  try {
    const props = PropertiesService.getScriptProperties();
    let id = props.getProperty(CLAIM_OWNER_KEY);
    if (!id) {
      id = "robo_" + Math.random().toString(36).slice(2, 10) + Math.random().toString(36).slice(2, 6);
      props.setProperty(CLAIM_OWNER_KEY, id);
    }
    return "robo:" + id;
  } catch (e) {
    return "robo:sem-props";
  }
}

/** Mesma chave que o app usa: cc_<cofre>_<id do Reel>. */
function claimKey(itemId) {
  return "cc_" + VAULT_HASH + "_" + String(itemId || "").replace(/[^a-zA-Z0-9._-]/g, "_").slice(0, 100);
}

/** true quando o backend não tem as rotas/ações de claims (versão antiga). */
function claimsIndisponiveis(status, json, text) {
  if (status === 404 || status === 405 || status === 501) return true;
  const msg = (json && json.error) || text || "";
  return /rota desconhecida|a[çc][ãa]o desconhecida|unknown (route|action)|n[ãa]o suportad/i.test(String(msg));
}

/**
 * Reclama o item antes de publicar.
 *   {ok:true, provider, key, owner}  → pode publicar (ou o backend não suporta claims)
 *   {ocupado:true, owner}            → outro dispositivo está a publicar: não publicar
 */
function reclamarPublicacao(itemId) {
  const key = claimKey(itemId);
  const owner = roboOwner();
  const payload = JSON.stringify({ key: key, owner: owner, ttlMs: CLAIM_TTL_MS });
  const problemas = [];

  if (r2Configurado()) {
    try {
      const res = UrlFetchApp.fetch(R2_WORKER_URL + "/api/claims/acquire", {
        method: "post",
        contentType: "application/json",
        headers: r2Headers(),
        payload: payload,
        muteHttpExceptions: true
      });
      const code = res.getResponseCode();
      const text = res.getContentText();
      let json = null;
      try { json = JSON.parse(text); } catch (e) {}
      if (claimsIndisponiveis(code, json, text)) {
        problemas.push("R2 sem claims");
      } else if (json && json.acquired === true) {
        return { ok: true, provider: "r2", key: key, owner: owner };
      } else if (json && json.acquired === false) {
        return { ocupado: true, provider: "r2", key: key, holder: (json.holder && json.holder.owner) || "", expiresAt: json.holder && json.holder.expiresAt };
      } else {
        problemas.push("R2 resposta inesperada");
      }
    } catch (e) {
      problemas.push("R2 " + e);
    }
  }

  if (driveConfigurado()) {
    try {
      const r = driveFetch({ action: "claim", token: DRIVE_TOKEN }, {
        method: "post",
        contentType: "application/json",
        payload: payload
      });
      const json = r.json;
      if (claimsIndisponiveis(r.code, json, r.text)) {
        problemas.push("Drive sem claims");
      } else if (json && json.acquired === true) {
        return { ok: true, provider: "drive", key: key, owner: owner };
      } else if (json && json.acquired === false) {
        return { ocupado: true, provider: "drive", key: key, holder: (json.holder && json.holder.owner) || "", expiresAt: json.holder && json.holder.expiresAt };
      } else {
        problemas.push("Drive resposta inesperada");
      }
    } catch (e) {
      problemas.push("Drive " + e);
    }
  }

  Logger.log("⚠️ Claims indisponíveis (" + problemas.join(" | ") + ") — a publicar sem proteção anti-duplicado. Atualiza o Worker/Apps Script para evitares Reels repetidos.");
  return { ok: true, degradado: true, key: key, owner: owner };
}

/** Liberta a claim (se falhar, o TTL de 10 min trata do assunto). */
function libertarReclamacao(claim) {
  if (!claim || !claim.ok || !claim.key) return;
  const payload = JSON.stringify({ key: claim.key, owner: claim.owner });
  try {
    if (claim.provider === "r2") {
      UrlFetchApp.fetch(R2_WORKER_URL + "/api/claims/release", {
        method: "post",
        contentType: "application/json",
        headers: r2Headers(),
        payload: payload,
        muteHttpExceptions: true
      });
    } else if (claim.provider === "drive") {
      driveFetch({ action: "release", token: DRIVE_TOKEN }, {
        method: "post",
        contentType: "application/json",
        payload: payload
      });
    }
  } catch (e) {
    Logger.log("(não consegui libertar a claim — expira sozinha: " + e + ")");
  }
}

// ------------------------------------------------------------------- cofre
function lerCofreNuvem() {
  if (r2Configurado()) {
    try {
      const res = UrlFetchApp.fetch(R2_WORKER_URL + "/api/vault/cc_" + VAULT_HASH, {
        method: "get",
        headers: r2Headers(),
        muteHttpExceptions: true
      });
      const code = res.getResponseCode();
      if (code === 200) {
        const text = res.getContentText();
        if (text && text.length > 2) {
          const vault = desencriptarTexto(text);
          if (vault) return vault;
        }
      } else if (code !== 404) {
        Logger.log("R2 devolveu HTTP " + code + " ao ler o cofre: " + res.getContentText().substring(0, 200));
      }
    } catch (e) {
      Logger.log("Falha a ler o cofre no R2 (a tentar o Drive): " + e);
    }
  }
  if (driveConfigurado()) {
    try {
      const r = driveFetch({ action: "vault", hash: VAULT_HASH, token: DRIVE_TOKEN });
      if (r.json && r.json.ok === true && r.json.cipher) {
        const vault = desencriptarTexto(r.json.cipher);
        if (vault) return vault;
        Logger.log("Drive: cofre encontrado mas não deu para desencriptar (a chave mudou?).");
      } else if (r.json && r.json.ok === false && r.json.code !== "not_found") {
        Logger.log("Drive devolveu erro ao ler o cofre: " + (r.json.error || r.text.substring(0, 200)));
      }
    } catch (e) {
      Logger.log("Falha a ler o cofre no Drive (a tentar o cofre antigo): " + e);
    }
  }
  return lerCofreLegado();
}

function lerCofreLegado() {
  try {
    const kvRes = UrlFetchApp.fetch(KV_BASE + "/GetValue/" + KV_APP + "/cc_" + VAULT_HASH + "?t=" + Date.now(), { muteHttpExceptions: true });
    if (kvRes.getResponseCode() !== 200) return null;
    const rawPointer = kvRes.getContentText().replace(/^"|"$/g, "").trim();
    if (!rawPointer) return null;
    const parts = rawPointer.split("__");
    for (let i = 0; i < parts.length; i++) {
      const p = parts[i];
      let url = "";
      if (p.indexOf("b_") === 0) url = "https://bytebin.lucko.me/" + p.slice(2) + "?t=" + Date.now();
      else if (p.indexOf("k_") === 0) url = "https://kappa.lol/" + p.slice(2) + ".json?t=" + Date.now();
      if (!url) continue;
      try {
        const r = UrlFetchApp.fetch(url, { muteHttpExceptions: true });
        if (r.getResponseCode() === 200) {
          const vault = desencriptarTexto(r.getContentText());
          if (vault) return vault;
        }
      } catch (e) {}
    }
  } catch (e) {
    Logger.log("Falha a ler o cofre antigo: " + e);
  }
  return null;
}

function salvarCofreNuvem(vault) {
  const encrypted = encriptarTexto(JSON.stringify(vault));
  let gravou = false;
  if (r2Configurado()) {
    try {
      const res = UrlFetchApp.fetch(R2_WORKER_URL + "/api/vault/cc_" + VAULT_HASH, {
        method: "put",
        headers: r2Headers({ "Content-Type": "application/json" }),
        payload: encrypted,
        muteHttpExceptions: true
      });
      if (res.getResponseCode() === 200) gravou = true;
      else Logger.log("R2 recusou a gravação do cofre: HTTP " + res.getResponseCode() + " " + res.getContentText().substring(0, 200));
    } catch (e) {
      Logger.log("Falha a gravar o cofre no R2: " + e);
    }
  }
  if (driveConfigurado()) {
    try {
      const r = driveFetch({ action: "vault", hash: VAULT_HASH, token: DRIVE_TOKEN }, {
        method: "post",
        contentType: "text/plain",
        payload: encrypted
      });
      if (r.json && r.json.ok === true) gravou = true;
      else Logger.log("Drive recusou a gravação do cofre: " + ((r.json && r.json.error) || r.text.substring(0, 200)));
    } catch (e) {
      Logger.log("Falha a gravar o cofre no Drive: " + e);
    }
  }
  if (gravou) {
    // espelho no índice antigo (compatibilidade com versões anteriores do Robô)
    try { salvarCofreLegado(encrypted); } catch (e) {}
    return true;
  }
  return salvarCofreLegado(encrypted);
}

function salvarCofreLegado(encryptedStr) {
  try {
    const r = UrlFetchApp.fetch("https://bytebin.lucko.me/post", {
      method: "post",
      contentType: "application/json",
      payload: encryptedStr,
      muteHttpExceptions: true
    });
    const data = JSON.parse(r.getContentText());
    if (data && data.key) {
      const res = UrlFetchApp.fetch(
        KV_BASE + "/UpdateValue/" + KV_APP + "/cc_" + VAULT_HASH + "/b_" + data.key + "?t=" + Date.now(),
        { method: "post", muteHttpExceptions: true }
      );
      return res.getResponseCode() === 200;
    }
  } catch (e) {
    Logger.log("Falha no cofre antigo (bytebin): " + e);
  }
  return false;
}

function testarLigacaoR2() {
  if (!r2Configurado()) {
    Logger.log("❌ R2 não configurado neste script. Copia o código novamente no CineClip depois de preencheres Configurações → Nuvem durável.");
    return;
  }
  try {
    const health = UrlFetchApp.fetch(R2_WORKER_URL + "/", { muteHttpExceptions: true });
    Logger.log("Health do Worker (HTTP " + health.getResponseCode() + "): " + health.getContentText());
    const stats = UrlFetchApp.fetch(R2_WORKER_URL + "/api/stats", { headers: r2Headers(), muteHttpExceptions: true });
    Logger.log("Estatísticas do bucket (HTTP " + stats.getResponseCode() + "): " + stats.getContentText());
    const vault = UrlFetchApp.fetch(R2_WORKER_URL + "/api/vault/cc_" + VAULT_HASH, { headers: r2Headers(), muteHttpExceptions: true });
    Logger.log("Cofre (HTTP " + vault.getResponseCode() + "): " + vault.getContentText().substring(0, 80) + "…");
  } catch (e) {
    Logger.log("❌ Erro no teste: " + e);
  }
}

function testarLigacaoDrive() {
  if (!driveConfigurado()) {
    Logger.log("❌ Google Drive não configurado neste script. No CineClip: Configurações → Nuvem durável → Google Drive, preenche o URL do Apps Script e o Token, clica em Guardar, e volta a copiar o código do Robô 24h.");
    return;
  }
  try {
    const health = driveFetch({ action: "health" });
    Logger.log("Health do Apps Script (HTTP " + health.code + "): " + health.text.substring(0, 300));
    if (!health.json || health.json.ok !== true) {
      Logger.log("❌ O URL não devolveu o JSON do backend CineClip. Confirma que a implantação é 'App da Web' com 'Quem pode aceder: Qualquer pessoa'.");
      return;
    }
    const stats = driveFetch({ action: "stats", token: DRIVE_TOKEN });
    Logger.log("Pasta CineClip Cloud (HTTP " + stats.code + "): " + stats.text.substring(0, 300));
    const vault = driveFetch({ action: "vault", hash: VAULT_HASH, token: DRIVE_TOKEN });
    if (!(vault.json && vault.json.ok === true)) {
      Logger.log("⚠️ Cofre no Drive: " + ((vault.json && vault.json.error) || vault.text.substring(0, 200)));
      return;
    }
    Logger.log("✔ Cofre encontrado (" + (vault.json.size || 0) + " bytes, gravado em " + (vault.json.savedAt || "?") + ").");
    const fila = desencriptarTexto(vault.json.cipher);
    if (!fila || !Array.isArray(fila.queue)) {
      Logger.log("⚠️ Li o cofre mas não o consegui desencriptar — a palavra-passe mudou desde que copiaste este código.");
      return;
    }
    Logger.log("Fila com " + fila.queue.length + " Reel(s). A verificar cada link de vídeo…");
    let vivos = 0;
    let mortos = 0;
    fila.queue.forEach(function (item) {
      if (!item.remoteVideoUrl) {
        Logger.log(" · ⚠️ " + item.title + " — SEM vídeo na nuvem");
        return;
      }
      const problema = verificarLink(item.remoteVideoUrl);
      if (problema) {
        mortos++;
        Logger.log(" · ❌ " + item.title + " — " + problema);
      } else {
        vivos++;
        Logger.log(" · ✔ " + item.title + " — link vivo");
      }
    });
    Logger.log((mortos === 0 ? "✅ " : "⚠️ ") + vivos + " link(s) vivo(s), " + mortos + " morto(s).");
  } catch (e) {
    Logger.log("❌ Erro no teste: " + e);
  }
}

function estadoDaFila() {
  const vault = lerCofreNuvem();
  if (!vault || !Array.isArray(vault.queue)) {
    Logger.log("Sem cofre na nuvem.");
    return;
  }
  Logger.log("Conta(s): " + (vault.accounts || []).map(function (a) { return a.name + "/" + a.mode; }).join(", "));
  Logger.log("Fila com " + vault.queue.length + " Reel(s):");
  vault.queue.forEach(function (item) {
    const quando = item.scheduledAt || new Date(item.scheduledTimestamp || 0).toISOString();
    Logger.log(" · [" + item.status + "] " + item.title + " — " + quando + (item.remoteVideoUrl ? " — ☁️ " + item.remoteVideoUrl.substring(0, 60) : " — ⚠️ SEM VÍDEO NA NUVEM") + (item.cloudError ? " — ERRO: " + item.cloudError : ""));
  });
}

    <style id="cc-agendador-css">
/* CineClip — Agendador (patch 22). Classes cc-* usadas por agendador.template.js */
.cc-ag{--cc-r:var(--radius,.75rem);--cc-soft:color-mix(in oklab,var(--foreground) 4%,transparent);--cc-line:var(--border);display:flex;flex-direction:column;gap:1rem;color:var(--foreground)}
.cc-ag .hidden{display:none}
.cc-sub{display:block;font-size:.75rem;color:var(--muted-foreground);line-height:1.35}
.cc-muted{color:var(--muted-foreground)}
.cc-kicker{font-size:.68rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--primary)}
.cc-label{display:inline-flex;align-items:center;gap:.35rem;font-size:.7rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted-foreground)}
.cc-card{border:1px solid var(--cc-line);background:var(--card);border-radius:calc(var(--cc-r) + 4px);padding:1rem}
.cc-input{height:2.25rem;border:1px solid var(--cc-line);background:var(--background);color:var(--foreground);border-radius:calc(var(--cc-r) - 2px);padding:0 .65rem;font-family:var(--font-mono);font-size:.8rem;color-scheme:dark;min-width:0}
.cc-input:focus{outline:2px solid color-mix(in oklab,var(--primary) 55%,transparent);outline-offset:1px}
.cc-input:disabled{opacity:.55}

/* cabeçalho */
.cc-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:.75rem}
.cc-head-l{display:flex;align-items:center;gap:.75rem;min-width:0}
.cc-logo{display:flex;align-items:center;justify-content:center;width:2.6rem;height:2.6rem;border-radius:calc(var(--cc-r) + 2px);color:var(--primary-foreground);box-shadow:0 6px 20px -8px var(--primary);flex-shrink:0}
.cc-h2{font-size:1.35rem;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.cc-head .cc-sub{display:flex;align-items:center;gap:.25rem;margin-top:.15rem}
.cc-warn-btn{display:inline-flex;align-items:center;gap:.4rem;border:1px solid color-mix(in oklab,var(--color-amber-400) 50%,transparent);background:color-mix(in oklab,var(--color-amber-400) 12%,transparent);color:var(--color-amber-400);border-radius:999px;padding:.35rem .8rem;font-size:.75rem;font-weight:600;cursor:pointer}
.cc-dot{display:inline-block;width:.5rem;height:.5rem;border-radius:999px;flex-shrink:0}
.cc-dot-ok{background:var(--success)}.cc-dot-warn{background:var(--color-amber-400)}

/* contas */
.cc-accounts{display:flex;flex-direction:column;gap:.5rem}
.cc-acc-scroll{display:flex;gap:.5rem;overflow-x:auto;padding-bottom:.15rem;scrollbar-width:thin}
.cc-acc{display:inline-flex;align-items:center;gap:.5rem;white-space:nowrap;border:1px solid var(--cc-line);background:var(--card);color:var(--muted-foreground);border-radius:999px;padding:.4rem .75rem;font-size:.8rem;font-weight:600;cursor:pointer;transition:all .15s}
.cc-acc:hover{color:var(--foreground);border-color:color-mix(in oklab,var(--primary) 45%,transparent)}
.cc-acc-on{color:var(--foreground);border-color:var(--primary);background:color-mix(in oklab,var(--primary) 16%,var(--card))}
.cc-acc-count{min-width:1.3rem;text-align:center;border-radius:999px;background:var(--secondary);padding:0 .35rem;font-size:.68rem;line-height:1.15rem}
.cc-acc-on .cc-acc-count{background:var(--primary);color:var(--primary-foreground)}
.cc-acc-add{border-style:dashed}
.cc-newacc{display:flex;flex-wrap:wrap;align-items:center;gap:.5rem;border:1px solid color-mix(in oklab,var(--primary) 35%,transparent);background:var(--card);border-radius:var(--cc-r);padding:.6rem}

/* resumo */
.cc-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.6rem}
.cc-stat{display:flex;flex-direction:column;align-items:flex-start;gap:.1rem;text-align:left;border:1px solid var(--cc-line);background:var(--card);border-radius:var(--cc-r);padding:.7rem .85rem;cursor:pointer;transition:border-color .15s,transform .15s;min-width:0}
.cc-stat:hover:not(:disabled){border-color:color-mix(in oklab,var(--primary) 45%,transparent);transform:translateY(-1px)}
.cc-stat-static,.cc-stat:disabled{cursor:default;opacity:1}
.cc-stat-label{font-size:.68rem;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--muted-foreground)}
.cc-stat-value{font-size:1.35rem;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.2}
.cc-stat-hint{font-size:.7rem;color:var(--muted-foreground);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.cc-stat-ok .cc-stat-value{color:var(--success)}
.cc-stat-err{border-color:color-mix(in oklab,var(--destructive) 50%,transparent)}.cc-stat-err .cc-stat-value{color:var(--destructive)}
.cc-stat-warn .cc-stat-hint{color:var(--color-amber-400)}

/* abas */
.cc-tabs{display:flex;gap:.25rem;padding:.25rem;border:1px solid var(--cc-line);background:var(--card);border-radius:calc(var(--cc-r) + 2px);overflow-x:auto}
.cc-tab{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:.45rem;white-space:nowrap;border-radius:var(--cc-r);padding:.55rem .75rem;font-size:.85rem;font-weight:600;color:var(--muted-foreground);cursor:pointer;transition:all .15s}
.cc-tab:hover{color:var(--foreground);background:var(--cc-soft)}
.cc-tab-on{background:var(--secondary);color:var(--foreground);box-shadow:inset 0 -2px 0 var(--primary)}
.cc-tab-count{border-radius:999px;background:var(--primary);color:var(--primary-foreground);font-size:.68rem;padding:0 .4rem;line-height:1.15rem}
.cc-panel{display:flex;flex-direction:column;gap:1rem}

/* novo agendamento */
.cc-compose{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:1rem 1.25rem;border-color:color-mix(in oklab,var(--primary) 35%,var(--cc-line));background:linear-gradient(135deg,color-mix(in oklab,var(--primary) 9%,var(--card)),var(--card) 60%)}
.cc-compose-clip{display:flex;gap:.8rem;align-items:center;min-width:0}
.cc-compose-txt{display:flex;flex-direction:column;gap:.15rem;min-width:0}
.cc-compose-title{font-size:1rem;font-weight:700;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.cc-compose-when{display:flex;flex-direction:column;gap:.5rem;min-width:0}
.cc-compose-actions{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:.5rem}
.cc-grow{flex:1 1 14rem}
.cc-chips{display:flex;flex-wrap:wrap;gap:.4rem;align-items:center}
.cc-chip{display:inline-flex;flex-direction:column;align-items:flex-start;border:1px solid var(--cc-line);background:var(--background);border-radius:calc(var(--cc-r) - 2px);padding:.3rem .6rem;cursor:pointer;transition:all .15s;line-height:1.15}
.cc-chip:hover{border-color:color-mix(in oklab,var(--primary) 50%,transparent)}
.cc-chip-on{border-color:var(--primary);background:color-mix(in oklab,var(--primary) 18%,var(--background));box-shadow:0 0 0 1px var(--primary)}
.cc-chip-day{font-size:.65rem;color:var(--muted-foreground)}
.cc-chip-time{font-family:var(--font-mono);font-size:.85rem;font-weight:700}
.cc-input-dt{align-self:flex-start}

/* poster */
.cc-poster{width:2.4rem;height:3.4rem;border-radius:.4rem;object-fit:cover;border:1px solid var(--cc-line);flex-shrink:0;background:var(--muted)}
.cc-poster-lg{width:3.4rem;height:4.9rem;border-radius:.55rem}
.cc-poster-empty{display:flex;align-items:center;justify-content:center;color:var(--muted-foreground)}

/* fila */
.cc-queue{display:flex;flex-direction:column;gap:.85rem}
.cc-queue-bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:.5rem}
.cc-fchips{display:flex;flex-wrap:wrap;gap:.35rem}
.cc-fchip{display:inline-flex;align-items:center;gap:.4rem;white-space:nowrap;border:1px solid var(--cc-line);border-radius:999px;padding:.3rem .7rem;font-size:.78rem;font-weight:600;color:var(--muted-foreground);cursor:pointer;background:transparent}
.cc-fchip:hover{color:var(--foreground)}
.cc-fchip-on{background:var(--foreground);color:var(--background);border-color:var(--foreground)}
.cc-fchip-n{font-size:.68rem;opacity:.75;font-variant-numeric:tabular-nums}
.cc-fchip-err:not(.cc-fchip-on){color:var(--destructive);border-color:color-mix(in oklab,var(--destructive) 45%,transparent)}
.cc-empty{display:flex;flex-direction:column;align-items:center;gap:.35rem;text-align:center;border:1px dashed var(--cc-line);border-radius:calc(var(--cc-r) + 4px);padding:2.25rem 1rem;color:var(--muted-foreground);font-size:.8rem}
.cc-empty strong{color:var(--foreground);font-size:.9rem}
.cc-empty svg{opacity:.45;margin-bottom:.25rem}
.cc-day{display:flex;flex-direction:column;gap:.4rem}
.cc-day-head{display:flex;align-items:center;justify-content:space-between;gap:.5rem;position:sticky;top:0;z-index:1;padding:.25rem .15rem;font-size:.75rem;font-weight:700;background:linear-gradient(var(--background) 70%,transparent)}
.cc-day-n{font-weight:500;color:var(--muted-foreground)}
.cc-day-list{display:flex;flex-direction:column;border:1px solid var(--cc-line);border-radius:calc(var(--cc-r) + 2px);overflow:hidden;background:var(--card)}
.cc-item{border-left:3px solid transparent}
.cc-item+.cc-item{border-top:1px solid var(--cc-line)}
.cc-item.cc-st-ok{border-left-color:var(--success)}
.cc-item.cc-st-err{border-left-color:var(--destructive);background:color-mix(in oklab,var(--destructive) 6%,transparent)}
.cc-item.cc-st-run{border-left-color:var(--primary)}
.cc-item.cc-st-late{border-left-color:var(--color-amber-400)}
.cc-item-open{background:var(--cc-soft)}
.cc-row{display:flex;align-items:center;gap:.75rem;padding:.65rem .75rem;cursor:pointer}
.cc-row:hover{background:var(--cc-soft)}
.cc-time{display:flex;flex-direction:column;align-items:flex-start;gap:.2rem;width:4.6rem;flex-shrink:0}
.cc-time strong{font-family:var(--font-mono);font-size:1.05rem;font-weight:800;font-variant-numeric:tabular-nums}
.cc-pill{font-size:.62rem;font-weight:700;border-radius:999px;padding:.05rem .45rem;white-space:nowrap}
.cc-pill.cc-st-wait{background:var(--secondary);color:var(--muted-foreground)}
.cc-pill.cc-st-ok{background:color-mix(in oklab,var(--success) 18%,transparent);color:var(--success)}
.cc-pill.cc-st-err{background:color-mix(in oklab,var(--destructive) 20%,transparent);color:var(--destructive)}
.cc-pill.cc-st-run{background:color-mix(in oklab,var(--primary) 20%,transparent);color:var(--primary)}
.cc-pill.cc-st-late{background:color-mix(in oklab,var(--color-amber-400) 18%,transparent);color:var(--color-amber-400)}
.cc-main{display:flex;flex-direction:column;gap:.25rem;min-width:0;flex:1}
.cc-title{display:flex;min-width:0;font-size:.88rem;font-weight:650}
.cc-title-txt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cc-title .cc-muted{flex-shrink:0;font-weight:400;font-size:.8rem;margin-left:.2rem}
.cc-badges{display:flex;flex-wrap:wrap;align-items:center;gap:.35rem}
.cc-size{font-family:var(--font-mono);font-size:.68rem;color:var(--muted-foreground)}
.cc-step{display:flex;align-items:center;gap:.35rem;font-size:.72rem;font-weight:500;color:var(--primary)}
.cc-err{display:flex;align-items:flex-start;gap:.35rem;font-size:.72rem;color:var(--destructive)}
.cc-actions{display:flex;align-items:center;gap:.2rem;flex-shrink:0}
.cc-icon-btn{width:2rem;padding:0!important}
.cc-chev svg{transition:transform .2s}.cc-chev-on svg{transform:rotate(180deg)}
.cc-details{display:flex;flex-direction:column;gap:.75rem;padding:.25rem .75rem .9rem calc(.75rem + 4.6rem + .75rem)}
.cc-fields{display:flex;flex-wrap:wrap;gap:.75rem}
.cc-field{display:flex;flex-direction:column;gap:.3rem;min-width:0}
.cc-caption{white-space:pre-wrap;font-size:.78rem;line-height:1.45;color:var(--muted-foreground);background:var(--background);border:1px solid var(--cc-line);border-radius:calc(var(--cc-r) - 2px);padding:.6rem .7rem;max-height:9rem;overflow:auto}
.cc-detail-actions{display:flex;flex-wrap:wrap;gap:.4rem;align-items:center}
.cc-del{margin-left:auto;color:var(--muted-foreground)}
.cc-del:hover{color:var(--destructive)!important}

/* conta e horários */
.cc-slots{display:flex;flex-direction:column;gap:.85rem}
.cc-slots-head{display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:space-between;gap:.75rem}
.cc-slots-head strong{font-size:.92rem}
.cc-slot{display:inline-flex;align-items:center;gap:.35rem;font-family:var(--font-mono);font-size:.88rem;font-weight:700;border:1px solid color-mix(in oklab,var(--primary) 40%,transparent);background:color-mix(in oklab,var(--primary) 12%,transparent);border-radius:999px;padding:.25rem .35rem .25rem .7rem}
.cc-slot button{display:inline-flex;align-items:center;justify-content:center;width:1.25rem;height:1.25rem;border-radius:999px;color:var(--muted-foreground);cursor:pointer}
.cc-slot button:hover{background:var(--destructive);color:#fff}
.cc-slot-add{display:inline-flex;align-items:center;gap:.4rem}
.cc-input-time{width:7.2rem}
.cc-switch{display:inline-flex;align-items:center;gap:.5rem;font-size:.8rem;cursor:pointer;border:1px solid var(--cc-line);border-radius:999px;padding:.35rem .75rem;background:var(--background)}
.cc-switch input{width:1rem;height:1rem;accent-color:var(--primary)}
.cc-switch-sm{align-self:flex-start;border:0;padding:0;background:transparent;color:var(--muted-foreground)}
.cc-panel>.space-y-4,.cc-panel>.space-y-3{margin-top:0!important}

/* novo agendamento sem vídeo (versão compacta) */
.cc-compose-empty{display:flex;align-items:center;gap:.8rem;padding:.75rem 1rem;border-style:dashed}
.cc-compose-empty .cc-compose-txt{flex:1}
.cc-compose-empty strong{font-size:.88rem}

/* ferramentas da fila: busca, ordenação, reorganizar */
.cc-tools{display:flex;flex-wrap:wrap;align-items:center;gap:.5rem}
.cc-search{flex:1 1 14rem;display:flex;align-items:center;gap:.45rem;height:2.25rem;border:1px solid var(--cc-line);background:var(--card);border-radius:calc(var(--cc-r) - 2px);padding:0 .65rem;color:var(--muted-foreground)}
.cc-search:focus-within{border-color:color-mix(in oklab,var(--primary) 60%,transparent)}
.cc-search input{flex:1;min-width:0;background:transparent;border:0;outline:0;color:var(--foreground);font-size:.82rem}
.cc-sort{display:inline-flex;align-items:center;gap:.4rem;font-size:.75rem;color:var(--muted-foreground)}
.cc-sort select{font-family:inherit;font-size:.78rem;cursor:pointer;background:var(--card)}
.cc-hint{font-size:.72rem;color:var(--muted-foreground);margin-top:-.35rem}

/* reordenar */
.cc-grip{display:flex;align-items:center;color:var(--muted-foreground);opacity:.45;cursor:grab;margin:0 -.35rem 0 -.25rem}
.cc-item:hover .cc-grip{opacity:1}
.cc-item[draggable=true]{cursor:default}
.cc-item-drag{opacity:.4}
.cc-item-over{box-shadow:inset 0 2px 0 var(--primary),inset 0 -2px 0 var(--primary);background:color-mix(in oklab,var(--primary) 10%,transparent)}
.cc-item-busy{pointer-events:none;opacity:.7}
.cc-move{display:flex;flex-direction:column;border:1px solid var(--cc-line);border-radius:.45rem;overflow:hidden;margin-right:.15rem}
.cc-move button{display:flex;align-items:center;justify-content:center;width:1.6rem;height:1rem;color:var(--muted-foreground);cursor:pointer;background:transparent}
.cc-move button+button{border-top:1px solid var(--cc-line)}
.cc-move button:hover:not(:disabled){background:var(--primary);color:var(--primary-foreground)}
.cc-move button:disabled{opacity:.25;cursor:default}
.cc-link{align-self:flex-start;display:inline-flex;align-items:center;gap:.25rem;font-size:.72rem;font-weight:600;color:var(--color-amber-400);cursor:pointer;background:transparent;padding:0}
.cc-link:hover{text-decoration:underline}
.cc-time-day{font-size:.65rem;color:var(--muted-foreground);line-height:1}

@media (max-width:640px){
  .cc-grip{display:none}
  .cc-compose-empty{flex-wrap:wrap}
  .cc-compose-empty>button{flex:1 1 100%}
  .cc-sort{flex:1}.cc-sort select{flex:1}
  .cc-stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .cc-compose{grid-template-columns:minmax(0,1fr)}
  .cc-hide-sm{display:none}
  .cc-tab{padding:.5rem .55rem;font-size:.8rem}
  .cc-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;grid-template-areas:"poster time actions" "poster main main";gap:.3rem .65rem;align-items:center}
  .cc-row>.cc-poster{grid-area:poster;align-self:start}
  .cc-time{grid-area:time;width:auto;flex-direction:row;align-items:center;gap:.45rem}
  .cc-actions{grid-area:actions}
  .cc-main{grid-area:main}
  .cc-details{padding:.25rem .75rem .9rem}
  .cc-del{margin-left:0}
  .cc-h2{font-size:1.2rem}
}
    </style>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
